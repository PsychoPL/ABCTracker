<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sécurité : aucune connexion réseau autorisée. Tout le code est dans ce fichier. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'none'; connect-src 'none'; frame-src 'none'; worker-src 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#11141c">
<title>ABC Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --radius:12px;
  --background:oklch(0.18 0.02 260);
  --foreground:oklch(0.97 0.01 260);
  --card:oklch(0.22 0.02 260);
  --primary:oklch(0.645 0.22 27);
  --primary-fg:oklch(0.99 0 0);
  --secondary:oklch(0.28 0.02 260);
  --muted:oklch(0.26 0.02 260);
  --muted-fg:oklch(0.72 0.02 260);
  --accent:oklch(0.30 0.03 260);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 12%);
  --sidebar:oklch(0.16 0.02 260);
  --sidebar-accent:oklch(0.24 0.02 260);
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;background:var(--background);color:var(--foreground);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:1.1rem;margin:0}
p{margin:0}
.muted{color:var(--muted-fg)}
.small{font-size:.8rem}
.xs{font-size:.72rem}
.bold{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.primary-text{color:var(--primary)}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:256px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;transition:width .15s}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .sb-text{display:none}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.sb-label{font-size:.72rem;color:var(--muted-fg);padding:8px 16px 4px}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.sb-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--foreground);text-decoration:none;font-size:.9rem;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.sb-link:hover{background:var(--sidebar-accent)}
.sb-link.active{background:var(--sidebar-accent);font-weight:600}
.sb-link svg{width:16px;height:16px;flex-shrink:0}
.sb-foot{margin-top:auto;padding:12px 8px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)!important;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:0;background:color-mix(in oklch,var(--background) 85%,transparent);backdrop-filter:blur(8px);z-index:20}
main{flex:1;min-width:0}
.page{padding:16px;max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page.narrow{max-width:900px}
.scrim{display:none}
@media (max-width:767px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;width:270px}
  .sidebar.collapsed{width:270px}
  .sidebar.collapsed .sb-text{display:inline}
  .sidebar.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgb(0 0 0 / 55%);z-index:40}
  .hide-mobile{display:none!important}
}
@media (min-width:768px){.page{padding:24px}}

/* Components */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.card-h{padding:18px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-t{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.card-t svg{width:16px;height:16px;color:var(--primary)}
.card-c{padding:14px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid transparent;padding:0 16px;height:38px;font-size:.9rem;font-weight:500;cursor:pointer;background:var(--primary);color:var(--primary-fg);white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.outline{background:transparent;border-color:var(--input);color:var(--foreground)}
.btn.outline:hover{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--foreground)}
.btn.ghost:hover{background:var(--accent)}
.btn.secondary{background:var(--secondary);color:var(--foreground)}
.btn.danger{background:oklch(0.5 0.2 27)}
.btn.lg{height:44px;padding:0 22px}
.btn.icon{width:36px;padding:0}
.btn svg{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--border);padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge.outline{background:transparent}
.badge.secondary{background:var(--secondary);border-color:transparent}
.badge.destructive{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.badge svg{width:14px;height:14px;color:var(--primary)}
.badge.lg{font-size:.85rem;padding:6px 12px}
label.lbl{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;background:transparent;border:1px solid var(--input);border-radius:8px;padding:0 12px;height:44px;outline:none}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
select.inp{appearance:auto;background:var(--card)}
select.inp option{background:var(--card);color:var(--foreground)}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px oklch(0.645 0.22 27 / 25%)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:768px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}}
.grid2c{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1024px){.grid2c{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.ml-auto{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--border);background:color-mix(in oklch,var(--muted) 30%,transparent);border-radius:10px;padding:12px}
.toolbar svg{width:16px;height:16px;color:var(--primary)}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seg-btn{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;border:1px solid var(--input);background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg-btn.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.seg-btn b{font-size:1.1rem;line-height:1}
.seg-btn span{font-size:.65rem;opacity:.85}
@media (max-width:639px){.seg-btn span{display:none}}
.fn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--border);border-radius:8px;padding:12px;background:color-mix(in oklch,var(--muted) 30%,transparent)}
@media (min-width:768px){.fn-grid{display:flex;flex-wrap:wrap;gap:12px}}
.chip{min-height:48px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);cursor:pointer;font-size:.88rem;font-weight:500}
@media (min-width:768px){.chip{min-height:0}}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;color:var(--muted-fg);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px;border-bottom:1px solid color-mix(in oklch,var(--border) 60%,transparent);vertical-align:middle}
.scroll-x{overflow-x:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:768px){.kpis{grid-template-columns:repeat(4,1fr);gap:16px}}
.kpi{display:flex;align-items:center;gap:12px;padding:16px}
.kpi-ic{width:42px;height:42px;border-radius:10px;background:oklch(0.645 0.22 27 / 15%);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-ic svg{width:20px;height:20px}
.kpi-l{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-fg)}
.kpi-v{font-size:1.5rem;font-weight:700}
.top3{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:768px){.top3{grid-template-columns:repeat(3,1fr)}}
.peak{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:10px;padding:16px;background:color-mix(in oklch,var(--muted) 20%,transparent)}
.peak:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--primary);opacity:var(--o,1)}
.list-div>li{border-bottom:1px solid var(--border)}
.list-div>li:last-child{border-bottom:0}
ul.clean,ol.clean{list-style:none;margin:0;padding:0}
.ged-item{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ged-item.done{border-color:oklch(0.645 0.22 27 / 40%)}
.ged-vals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ged-vals button{height:44px;border-radius:8px;border:1px solid var(--input);background:transparent;font-weight:600;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ged-vals button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.legend{border:1px solid var(--border);border-radius:8px;padding:12px;background:color-mix(in oklch,var(--muted) 20%,transparent);font-size:.78rem;color:var(--muted-fg)}
.legend b{color:var(--foreground)}
.heat{display:grid;grid-template-columns:140px repeat(7,minmax(0,1fr));min-width:720px}
.heat>div{padding:8px;font-size:.8rem}
.heat .hd{font-size:.72rem;font-weight:600;color:var(--muted-fg);text-align:center}
.heat .sl{color:var(--muted-fg);border-top:1px solid color-mix(in oklch,var(--border) 70%,transparent);font-size:.72rem}
.heat .cl{border-top:1px solid color-mix(in oklch,var(--border) 70%,transparent);border-left:1px solid color-mix(in oklch,var(--border) 70%,transparent);text-align:center;font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart{min-height:40px}
.chart text{fill:var(--muted-fg);font-size:11px}
.pie-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.7rem;color:var(--muted-fg);margin-top:6px}
.pie-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.section h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);margin:0 0 8px;font-weight:600}
.section{font-size:.9rem;line-height:1.6}
.section+.section{margin-top:22px}

/* Popover & modal */
.pop{position:absolute;right:12px;top:52px;width:300px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgb(0 0 0 / 45%);z-index:60}
.pop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
.pop-item:hover,.pop-item.on{background:var(--muted)}
.pop-item svg{width:16px;height:16px;flex-shrink:0}
.logo svg{width:26px;height:26px}
.pop-item .x{margin-left:auto;background:none;border:0;color:var(--muted-fg);cursor:pointer;padding:4px;border-radius:4px}
.pop-item .x:hover{color:var(--primary)}
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0 / 60%);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px}
.modal h2{margin-bottom:12px}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;box-shadow:0 8px 30px rgb(0 0 0 / 40%);font-size:.9rem}
.toast.err{border-color:var(--primary)}

/* Lock screen */
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.lock .card{width:100%;max-width:440px;padding:28px;text-align:center}
.lock .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 14px;font-size:1.4rem}
.lock form{display:flex;flex-direction:column;gap:12px;margin-top:18px;text-align:left}
.warn{border:1px solid oklch(0.645 0.22 27 / 45%);background:oklch(0.645 0.22 27 / 10%);border-radius:8px;padding:10px 12px;font-size:.8rem;line-height:1.5;text-align:left}

/* Print */
.print-only{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111!important}
  .sidebar,header.top,.no-print,.toasts,.scrim,.pop{display:none!important}
  .print-only{display:block!important}
  .page{padding:0!important;max-width:100%!important}
  .card,.peak,.legend{background:#fff!important;border-color:#ccc!important;color:#111!important}
  .print-card{break-inside:avoid;page-break-inside:avoid}
  .muted,.primary-text,.kpi-l,.section h3{color:#111!important}
  .kpi-ic{background:#f2f2f2!important}
  .chart text{fill:#333!important}
  .badge{border-color:#999!important;background:#fff!important;color:#111!important}
  .print-tbl{width:100%;border-collapse:collapse;font-size:11px}
  .print-tbl th,.print-tbl td{border:1px solid #999;padding:4px 8px;text-align:left}
}
</style>
</head>

function computeBuckets(g){
  const total=(END_HOUR-START_HOUR+1)*60, count=Math.ceil(total/g), out=[];
  for(let i=0;i<count;i++){ const s=START_HOUR*60+i*g; out.push({start:s, chart:(g===60||g===30)?fmtCompact(s):`${fmtCompact(s)}-${fmtCompact(s+g)}`, full:`${fmtHM(s)} - ${fmtHM(s+g)}`}); }
  return out;
}

  if(off<0) return -1; const idx=Math.floor(off/g), max=Math.ceil(((END_HOUR-START_HOUR+1)*60)/g)-1;

}

/* =====================================================================
   COFFRE CHIFFRÉ (IndexedDB + WebCrypto)
   ===================================================================== */
const DB_NAME="abc-tracker-local", STORE="kv", PBKDF2_ITER=600000;
const b64 = (buf) => { const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function idb(){
  return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
async function kvGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(STORE).objectStore(STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
async function kvSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function kvDel(k){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function deriveKey(pass, salt, iter){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptObj(key, obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decryptObj(key, iv, ct){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(iv)}, key, unb64(ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const emptyData = () => ({version:1, residents:[], entries:[], notes:{}, pain:[], prefs:{selected:"", rempliPar:"", lockMinutes:5}});

async function saveNow(){

}

const normalize = (data) => { const d=Object.assign(emptyData(), data); d.prefs=Object.assign(emptyData().prefs, data.prefs||{}); return d; };

/* =====================================================================
   OUVERTURE — sans mot de passe.
   Les données restent chiffrées sur le disque avec une clé propre à cet
   appareil (générée à la première ouverture, non exportable).
   ===================================================================== */
async function getDeviceKey(){
  let k=await kvGet("devkey");
  if(!k){ k=await crypto.subtle.generateKey({name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); await kvSet("devkey", k); }
  return k;
}
async function openVault(){
  const vault=await kvGet("vault").catch(()=>null);
  if(vault && vault.salt) return renderLegacyUnlock(vault);
  try{
    S.key=await getDeviceKey();
    if(!vault){ S.data=emptyData(); seedDemo(S.data); await saveNow(); }
    else S.data=normalize(await decryptObj(S.key, vault.iv, vault.ct));
  }catch(err){ return renderUnreadable(); }
  requestPersist(); startApp();
}

/* GED-DI */
const computeScore = (items) => items.reduce((s,v)=>s+(typeof v==="number"?v:0),0);
function findReferenceBase(t, all){
  const c=all.filter(a=>a.type==="etat_de_base" && a.resident===t.resident && a.id!==t.id && a.date<=t.date);
  if(!c.length) return null;
  c.sort((a,b)=> a.date===b.date ? (a.created_at<b.created_at?1:-1) : (a.date<b.date?1:-1));
  return c[0];
}
function evaluate(a, all){
  if(a.type==="etat_de_base") return {kind:"base"};
  const base=findReferenceBase(a, all); if(!base) return {kind:"no_base"};
  const ecart=a.score-base.score;
  return {kind:"ecart", base, ecart, douleur:Math.abs(ecart) > GED_THRESHOLD};
}
const formatEcart = (n) => n>0?`+${n}`: n<0?`−${Math.abs(n)}`:"0";
function resultBadge(r){
  if(r.kind==="base") return `<span class="badge outline">Référence</span>`;
  if(r.kind==="no_base") return `<span class="badge secondary">Pas de grille de base de référence</span>`;
  return r.douleur ? `<span class="badge destructive">Témoigne de douleur</span>` : `<span class="badge secondary">Non significatif</span>`;
}

/* =====================================================================
   GRAPHIQUES SVG (sans bibliothèque)
   ===================================================================== */
const C_RED="oklch(0.645 0.22 27)", C_GRID="oklch(1 0 0 / 8%)";
const PIE_COLORS=["oklch(0.645 0.22 27)","oklch(0.7 0.18 60)","oklch(0.72 0.16 155)","oklch(0.65 0.18 220)","oklch(0.6 0.2 300)","oklch(0.75 0.14 90)","oklch(0.55 0.15 340)"];
function niceMax(m){ if(m<=5) return Math.max(1,m); const p=Math.pow(10,Math.floor(Math.log10(m))); for(const k of [1,2,2.5,5,10]) if(k*p>=m) return k*p; return m; }
function ticks(max){ const n=Math.min(max,5); const step=max/n; return Array.from({length:n+1},(_,i)=>Math.round(i*step*100)/100); }
function hbar(data, {labelW=170, color=C_RED, rowH=34, fullLabels=null, W=620}={}){
  labelW=Math.min(labelW, Math.round(W*0.42));
  const plotW=W-labelW-36, H=Math.max(1,data.length)*rowH+28;
  const max=niceMax(Math.max(0,...data.map(d=>d.value)));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const t of ticks(max)){ const x=labelW+(t/max)*plotW; s+=`<line x1="${x}" x2="${x}" y1="4" y2="${H-22}" stroke="${C_GRID}" stroke-dasharray="3 3"/><text x="${x}" y="${H-6}" text-anchor="middle">${Number.isInteger(t)?t:""}</text>`; }
  data.forEach((d,i)=>{
    const y=8+i*rowH, w=max?(d.value/max)*plotW:0, mc=Math.max(6,Math.floor((labelW-12)/6.3)), lab=d.label.length>mc?d.label.slice(0,mc-1)+"…":d.label;
    s+=`<text x="${labelW-8}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle">${esc(lab)}</text>`;
    if(w>0) s+=`<path d="M${labelW} ${y+5}h${Math.max(0,w-6)}a6 6 0 0 1 6 6v${rowH-22}a6 6 0 0 1-6 6h-${Math.max(0,w-6)}z" fill="${color}"><title>${esc((fullLabels&&fullLabels[i])||d.label)} : ${d.value}</title></path>`;
    s+=`<text x="${labelW+w+6}" y="${y+rowH/2}" dominant-baseline="middle" style="fill:var(--foreground)">${d.value||""}</text>`;
  });
  return s+"</svg>";
}
function lineChart(data, {fulls=null, rotate=true, W=620}={}){
  const H=280, L=rotate?64:34, R=14, T=10, B=rotate?66:30, pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max(0,...data.map(d=>d.y)));
  const n=data.length, xAt=(i)=> L+(n<=1?pw/2:(i/(n-1))*pw), yAt=(v)=>T+ph-(max?v/max:0)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const t of ticks(max)){ const y=yAt(t); s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${C_GRID}" stroke-dasharray="3 3"/>`; if(Number.isInteger(t)) s+=`<text x="${L-6}" y="${y}" text-anchor="end" dominant-baseline="middle">${t}</text>`; }
  const every=Math.max(1,Math.ceil(n/Math.max(4,Math.floor(W/46))));
  data.forEach((d,i)=>{ if(i%every && !(i===n-1 && (n-1)%every>=every/2)) return; const x=xAt(i); s+= rotate ? `<text transform="translate(${x},${T+ph+12}) rotate(-35)" text-anchor="end">${esc(d.x)}</text>` : `<text x="${x}" y="${T+ph+16}" text-anchor="middle">${esc(d.x)}</text>`; });
  if(n){
    let path=""; data.forEach((d,i)=>{ path+=(i?"L":"M")+xAt(i).toFixed(1)+" "+yAt(d.y).toFixed(1); });
    s+=`<path d="${path}" fill="none" stroke="${C_RED}" stroke-width="2.5" stroke-linejoin="round"/>`;
    data.forEach((d,i)=>{ s+=`<circle cx="${xAt(i)}" cy="${yAt(d.y)}" r="3.5" fill="${C_RED}"><title>${esc(fulls?fulls[i]:d.x)} : ${d.y} occurrence${plural(d.y)}</title></circle>`; });
  }
  return s+"</svg>";
}
function pieChart(data, offset=0){
  const total=data.reduce((s,d)=>s+d.value,0); if(!total) return `<p class="muted small" style="text-align:center;padding:40px 0">Pas de données.</p>`;
  const W=320,H=230,cx=160,cy=115,r=92; let a0=-Math.PI/2, s=`<svg viewBox="0 0 ${W} ${H}" style="max-width:360px;margin:0 auto">`, lab="";
  data.forEach((d,i)=>{
    const frac=d.value/total, a1=a0+frac*2*Math.PI, col=PIE_COLORS[(i+offset)%PIE_COLORS.length];
    if(frac>=0.9999){ s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}"><title>${esc(d.label)} : ${d.value}</title></circle>`; }
    else { const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      s+=`<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${frac>.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${col}" stroke="var(--card)" stroke-width="1"><title>${esc(d.label)} : ${d.value}</title></path>`; }
    const am=(a0+a1)/2, lx=cx+(r+14)*Math.cos(am), ly=cy+(r+14)*Math.sin(am);
    if(frac>=0.03) lab+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.cos(am)>=0?"start":"end"}" dominant-baseline="middle" style="fill:${col}">${Math.round(frac*100)}%</text>`;
    a0=a1;
  });
  s+=lab+"</svg>";
  s+=`<div class="pie-leg">${data.map((d,i)=>`<span><i style="background:${PIE_COLORS[(i+offset)%PIE_COLORS.length]}"></i>${esc(d.label)}</span>`).join("")}</div>`;
  return s;
}

function renderResidentSelector(){
  const sel=selected(), res=D().residents;
  $("#resident-sel").innerHTML = `

/* Délégation d'événements globale */
document.addEventListener("click",(e)=>{
  if(!S.data) return;
  const t=e.target.closest("[data-act]");
  if(S.popOpen && !e.target.closest("#pop") && !(t&&t.dataset.act==="pop")){ S.popOpen=false; renderResidentSelector(); }
  if(!t) return;
  const a=t.dataset.act;
  if(a==="toggle-sidebar"){ if(window.innerWidth<768) S.sidebarOpen=!S.sidebarOpen; else S.sidebarCollapsed=!S.sidebarCollapsed; renderShell(); }
  else if(a==="pop"){ S.popOpen=!S.popOpen; renderResidentSelector(); }
  else if(a==="pick"){ if(e.target.closest(".x")) return; setSelected(D().residents[+t.dataset.i]); S.popOpen=false; S.gedDraft=null; renderShell(); renderMain(); }
  else if(a==="rm-res"){ e.stopPropagation(); const n=D().residents[+t.dataset.i];
    const nE=D().entries.filter(x=>x.resident===n).length, nP=D().pain.filter(x=>x.resident===n).length;
    if(confirm(`Supprimer « ${n} » ainsi que ses ${nE} observation(s) ABC, ses ${nP} grille(s) GED-DI et ses notes ? Action définitive.`)){ removeResident(n); S.popOpen=false; renderShell(); renderMain(); toast("Profil supprimé."); } }
  else if(ACTIONS[a]) ACTIONS[a](t, e);
});
$("#root").addEventListener("click",(e)=>{ if(e.target.id==="scrim"){ S.sidebarOpen=false; renderShell(); } });
window.addEventListener("hashchange",()=>{ if(!S.data) return; S.sidebarOpen=false; S.popOpen=false; renderShell(); renderMain(); window.scrollTo(0,0); });

}

function rapportStats(entries, g){
  const total=entries.length, active=new Set(entries.map(e=>e.date)).size;
  const avgI=total?entries.reduce((s,e)=>s+e.intensite,0)/total:0, avgD=active?total/active:0;
  const per=computeBuckets(g).map(b=>({...b,count:0,high:0}));
  for(const e of entries){ const i=bucketIndexOf(e.heure,g); if(i<0||i>=per.length) continue; per[i].count++; if(e.intensite>=4) per[i].high++; }
  const top3=[...per].filter(b=>b.count>0).sort((a,b)=>b.count-a.count).slice(0,3).map(b=>({...b,pct:total?b.count/total*100:0}));
  const highTotal=per.reduce((s,b)=>s+b.high,0);
  const th=[...per].filter(b=>b.high>0).sort((a,b)=>b.high-a.high)[0];
  const topHigh=th?{...th,pct:highTotal?th.high/highTotal*100:0}:null;
  const perFn=Object.fromEntries(ABA_FUNCTIONS.map(f=>[f,0])); let fnTotal=0;
  for(const e of entries) for(const f of (e.fonctions||[])) if(f in perFn){ perFn[f]++; fnTotal++; }
  const fnChart=ABA_FUNCTIONS.map(f=>({fonction:f,count:perFn[f],pct:fnTotal?perFn[f]/fnTotal*100:0}));
  const dominant=[...fnChart].sort((a,b)=>b.count-a.count)[0];
  return {total,active,avgI,avgD,per,top3,highTotal,topHigh,fnChart,dominant,fnTotal};
}

async function importFlow(file){
  let pkg; try{ pkg=JSON.parse(await file.text()); if(pkg.app!=="abc-tracker-local"||!pkg.ct) throw 0; }catch(e){ return toast("Ce fichier n'est pas une sauvegarde ABC Tracker.", true); }
  openModal(`<h2>Importer une sauvegarde</h2><form autocomplete="off" id="f-imp" class="stack small">
    <p>Fichier : <b>${esc(file.name)}</b>${pkg.exported?` (exporté le ${new Date(pkg.exported).toLocaleString("fr-FR")})`:""}</p>
    <div><label class="lbl">Mot de passe de cette sauvegarde</label><input class="inp" type="password" id="imp-p" required autocomplete="off"></div>
    <p class="muted"><b>Fusionner</b> ajoute les profils, observations et grilles absents de cet appareil. <b>Remplacer</b> efface les données actuelles de l'appareil et les remplace par la sauvegarde.</p>
    <p class="muted xs" id="imp-msg"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="close-modal">Annuler</button><button type="submit" class="btn outline" name="mode" value="replace">Remplacer</button><button type="submit" class="btn" name="mode" value="merge">Fusionner</button></div>
  </form>`);
  $("#f-imp").onsubmit=async(e)=>{
    e.preventDefault(); const mode=e.submitter?e.submitter.value:"merge";
    $("#imp-msg").textContent="Déchiffrement…";
    let data; try{ const k=await deriveKey($("#imp-p").value, unb64(pkg.salt), pkg.iter||PBKDF2_ITER); data=await decryptObj(k, pkg.iv, pkg.ct); }
    catch(err){ $("#imp-msg").textContent="Mot de passe incorrect pour cette sauvegarde."; return; }
    if(mode==="replace"){
      if(!confirm("Remplacer TOUTES les données de cet appareil par la sauvegarde ?")) return;
      const keepLock=D().prefs.lockMinutes;
      S.data=Object.assign(emptyData(), data); S.data.prefs=Object.assign(emptyData().prefs, data.prefs||{}, {lockMinutes:keepLock});
    } else {
      const d=D(); let nE=0,nP=0,nR=0;
      for(const r of data.residents||[]) if(!d.residents.includes(r)){ d.residents.push(r); nR++; }
      const eIds=new Set(d.entries.map(x=>x.id)); for(const x of data.entries||[]) if(!eIds.has(x.id)){ d.entries.push(x); nE++; }
      const pIds=new Set(d.pain.map(x=>x.id)); for(const x of data.pain||[]) if(!pIds.has(x.id)){ d.pain.push(x); nP++; }
      for(const [k,v] of Object.entries(data.notes||{})) if(!d.notes[k]) d.notes[k]=v; else if(v && v!==d.notes[k] && !d.notes[k].includes(v)) d.notes[k]+= "\n\n--- (importé) ---\n"+v;
      if(!d.prefs.selected && d.residents.length) d.prefs.selected=d.residents[0];
      toast(`Fusion : ${nR} profil(s), ${nE} observation(s), ${nP} grille(s) ajoutés.`);
    }
    await flushSave(); closeModal(); renderShell(); renderMain(); if(mode==="replace") toast("Données remplacées par la sauvegarde.");
  };
  setTimeout(()=>$("#imp-p")&&$("#imp-p").focus(),50);
}

const DEMO_NAME="Profil fictif";
function seedDemo(d){
  if(!d.residents.includes(DEMO_NAME)) d.residents.push(DEMO_NAME);
  const iso=(da)=>{ const x=new Date(); x.setDate(x.getDate()-da); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
  // Générateur pseudo-aléatoire déterministe : même jeu de données à chaque fois.
  let seed=20261030; const rnd=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
  const pick=(a)=>a[Math.floor(rnd()*a.length)];
  // Scénarios typiques : [heures possibles, comportements, antécédents, conséquences, fonctions, lieux, intensités, commentaires]
  const S1=[["09:45","10:00","10:15","10:30","10:45","11:00"],[4,3,0,2],[0,0,1],[2],["Échappement"],["Atelier","Atelier","Activité cuisine"],[3,4,4,5],["Refus dès la présentation de la consigne.","A repoussé le matériel de l'atelier.","Retrait de la tâche par l'équipe.",""]];
  const S2=[["16:45","17:00","17:15","17:30","17:45"],[3,0,4],[2],[2,0],["Échappement"],["Salon","Couloir","Salle à manger"],[3,4,5],["Transition vers le repas difficile.","Refus de quitter le salon.",""]];
  const S3=[["14:00","14:30","15:00","15:30"],[1,3],[4],[0],["Attention"],["Chambre","Salon"],[2,2,3],["Seul pendant le temps calme.","Se calme dès qu'un adulte s'approche.",""]];
  const S4=[["20:00","20:30","21:00"],[5],[6,5],[3],["Sensoriel"],["Chambre"],[1,2],["Balancements avant le coucher.","Auto-régulation, pas d'intervention nécessaire.",""]];
  const S5=[["13:00","13:30","15:30"],[3,2],[3],[1],["Tangible"],["Salle à manger","Salon"],[2,3],["Tablette retirée à la fin du temps prévu.",""]];
  for(let da=27; da>=0; da--){
    const dow=new Date(Date.now()-da*864e5).getDay(), weekend=(dow===0||dow===6);
    const plan=[];
    if(!weekend && rnd()<0.75) plan.push(S1);
    if(rnd()<0.55) plan.push(S2);
    if(rnd()<0.25) plan.push(S3);
    if(rnd()<0.2) plan.push(S4);
    if(rnd()<0.15) plan.push(S5);
    for(const sc of plan){
      const [hs,cs,as,qs,fs,ls,is,cms]=sc;
      d.entries.push({id:uid(), date:iso(da), heure:pick(hs), resident:DEMO_NAME, comportement:COMPORTEMENTS[pick(cs)], intensite:pick(is), lieu:pick(ls), antecedent:ANTECEDENTS[pick(as)], consequence:CONSEQUENCES[pick(qs)], fonctions:[...fs], commentaire:pick(cms), createdAt:Date.now()-da*864e5});
    }
  }
  // Grilles GED-DI : illustrent chaque cas (écart > 6 à la hausse, à la baisse, écart de 6 non significatif, nouvelle base).
  const grid=(da,type,vals,ctx,per)=>{ const items=GED_ITEMS.map((_,k)=> k in vals ? vals[k] : 0); items[25]= 25 in vals ? vals[25] : "NA";
    d.pain.push({id:uid(), resident:DEMO_NAME, date:iso(da), rempli_par:"Équipe (démo)", type, periode_observation:per, contexte:ctx, items, score:computeScore(items), created_at:new Date(Date.now()-da*864e5).toISOString()}); };
  grid(27,"etat_de_base",{0:1,3:1,4:1,6:1,12:1,14:2,26:1},"Grille de référence, période calme.","Semaine");
  grid(20,"trouble_du_comportement",{0:2,1:1,2:2,3:2,4:2,6:2,7:1,9:1,12:2,14:2,17:1,26:1},"Agitation inhabituelle, porte souvent la main à la joue.","Journée");
  grid(17,"trouble_du_comportement",{13:1},"Très en retrait, inactif, refuse les sollicitations.","Demi-journée");
  grid(14,"trouble_du_comportement",{0:2,3:2,4:1,6:1,7:1,12:2,14:3,26:2},"Plus irritable que d'habitude après un week-end en famille.","Journée");
  grid(10,"etat_de_base",{3:1,4:1,6:1,14:2,26:1},"Nouvelle grille de référence après les soins dentaires.","Semaine");
  grid(6,"trouble_du_comportement",{3:1,4:1,14:2,26:1},"Contrôle de routine.","Journée");
  grid(2,"trouble_du_comportement",{0:2,2:1,3:2,4:1,6:2,7:1,12:1,14:2,18:1},"Se soustrait au toucher au niveau du ventre, mange peu.","Journée");
  if(!d.notes[DEMO_NAME]) d.notes[DEMO_NAME]="Hypothèse de fonction (exemple) : comportements majoritairement maintenus par l'échappement aux consignes en atelier (10h-11h) et lors des transitions vers le repas (17h-18h).\nPistes : séquencer la consigne, annonce visuelle des transitions 15 min avant, renforcer la coopération.\nÀ surveiller : plusieurs grilles GED-DI témoignent d'une douleur possible (voir l'onglet Douleur).";
  if(!d.prefs.selected) d.prefs.selected=DEMO_NAME;
}
ACTIONS["demo"]=()=>{
  const d=D();
  if(d.residents.includes(DEMO_NAME)){
    if(!confirm(`Le profil « ${DEMO_NAME} » existe déjà. Le réinitialiser avec des données de démonstration neuves ?`)) return;
    d.entries=d.entries.filter(e=>e.resident!==DEMO_NAME); d.pain=d.pain.filter(p=>p.resident!==DEMO_NAME); delete d.notes[DEMO_NAME];
  }
  seedDemo(d); d.prefs.selected=DEMO_NAME; S.gedDraft=null; scheduleSave(); renderShell(); renderMain(); toast(`Profil « ${DEMO_NAME} » prêt pour la démonstration.`);
};

/* ---------- Fenêtre modale ---------- */
function openModal(html){ closeModal(); const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modal"; bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener("mousedown",(e)=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); }
function closeModal(){ const m=$("#modal"); if(m) m.remove(); }
ACTIONS["close-modal"]=closeModal;
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ closeModal(); if(S.popOpen){ S.popOpen=false; renderResidentSelector(); } } });

/* Mode application (installable) : uniquement quand la page est servie en HTTPS.
   Le service worker ne sert que les fichiers de l'appli depuis le cache, pour fonctionner hors ligne. */
if (location.protocol === "https:" || location.hostname === "localhost") {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
(function boot(){
  if(!window.crypto || !crypto.subtle || !window.indexedDB){
    $("#root").innerHTML=`<div class="lock"><div class="card"><h1>Navigateur non compatible</h1><p class="muted small" style="margin-top:8px">Ce navigateur ne permet pas le chiffrement local dans ce mode d'ouverture. Ouvrez le fichier avec Chrome ou Edge à jour. Sur Android, voir la notice d'installation.</p></div></div>`;
    return;
  }
  openVault();
})();
